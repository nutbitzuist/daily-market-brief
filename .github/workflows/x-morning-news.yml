name: Send X Morning News

on:
  workflow_dispatch:
    inputs:
      digest_b64:
        description: Base64-encoded UTF-8 digest generated by Jax X research
        required: true
        type: string
      date_bkk:
        description: Bangkok date (YYYY-MM-DD)
        required: true
        type: string
      sources_b64:
        description: Base64-encoded Markdown source/audit packet
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: x-morning-news-${{ inputs.date_bkk }}
  cancel-in-progress: false

jobs:
  send-x-morning-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Archive and send verified Telegram digest
        env:
          DIGEST_B64: ${{ inputs.digest_b64 }}
          SOURCES_B64: ${{ inputs.sources_b64 }}
          ARCHIVE_PATH: x-digests/${{ inputs.date_bkk }}.md
          SOURCE_ARCHIVE_PATH: x-digests/sources/${{ inputs.date_bkk }}.md
          EXPECTED_CHAT_TITLE: Daily News Update
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_x_digest.py

      - name: Commit archived digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-digests/
          git diff --staged --quiet && exit 0
          git commit -m "🐦 X morning news ${{ inputs.date_bkk }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
