name: Daily Thai Market Pulse

on:
  schedule:
    # 10:30 UTC = 17:30 Asia/Bangkok, Mon-Fri (SET trading days only)
    # Use :30 instead of top-of-hour to reduce GitHub Actions schedule delays.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      session_date:
        description: 'Incomplete trading session to finish (YYYY-MM-DD); blank means today'
        required: false
        default: ''
        type: string

concurrency:
  group: thai-market-pulse-delivery
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify delivery regression gates
        run: python -m unittest discover -s tests -p test_pulse_delivery.py -v

      - name: Generate Thai Market Pulse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_URL: https://github.com/${{ github.repository }}
          PULSE_SESSION_DATE: ${{ inputs.session_date }}
        run: python scripts/th_market_pulse.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulse/
          git diff --staged --quiet && exit 0
          git commit -m "🇹🇭 thai market pulse $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
